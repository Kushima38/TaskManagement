spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanagement
    username: taskmanagement
    password: taskmanagement

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
